name: Manage Release PRs and Publish Crates

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.FG_LABS_BOT_APP_ID }}
          private-key: ${{ secrets.FG_LABS_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Create or update release PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.FG_LABS_BOT_APP_ID }}
          private-key: ${{ secrets.FG_LABS_BOT_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # Keep the App token out of git config: `cargo package` runs build
          # scripts. The release step restores git auth for its tag push.
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libxml2-dev
      - name: Authenticate to crates.io via Trusted Publishing
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Verify lockstep workspace versions
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "fg-sra") | .version')
          MISMATCHES=$(cargo metadata --no-deps --format-version 1 | jq -r \
            --arg ver "$WORKSPACE_VERSION" \
            '.packages[] | select(.name | startswith("fg-sra")) | select(.version != $ver) | "\(.name) \(.version)"')
          if [ -n "$MISMATCHES" ]; then
            echo "ERROR: workspace version drift detected (expected $WORKSPACE_VERSION):"
            echo "$MISMATCHES"
            exit 1
          fi
          echo "All workspace crates at v$WORKSPACE_VERSION"
      - name: Publish workspace crates in dependency order
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail

          # All workspace crates share a single version (lockstep).
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.name == "fg-sra") | .version')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Each crate is checked separately (not just fg-sra-vdb-sys, the first
          # published): verification can fail a later crate after an earlier one
          # was published, and a rerun must then publish the rest.
          echo "Publishing workspace crates not yet at v$VERSION..."
          PUBLISHED=false

          # Publish helper. `cargo package` verifies each package by building it
          # from its tarball (fg-sra-vdb-sys carries the vendored ncbi-vdb source)
          # without the registry token, so build scripts cannot read it; the
          # verified package is then uploaded without building it again.
          publish_crate() {
            local crate="$1"
            local max_version
            max_version=$(curl -sS \
              -H "User-Agent: fg-sra-ci (https://github.com/fg-labs/fg-sra)" \
              "https://crates.io/api/v1/crates/${crate}" | jq -r \
              '.crate.max_version // "0.0.0"')

            if [ "$max_version" = "$VERSION" ]; then
              echo "$crate v$VERSION already exists on crates.io -- skipping"
              return
            fi

            echo "Publishing $crate v$VERSION..."
            env -u CARGO_REGISTRY_TOKEN cargo package -p "$crate"
            cargo publish --no-verify -p "$crate"
            echo "Published $crate v$VERSION"
            PUBLISHED=true
          }

          # Workspace crates in topological (dependency) order.
          publish_crate fg-sra-vdb-sys
          publish_crate fg-sra-vdb
          publish_crate fg-sra

          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.publish.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          VERSION="${{ steps.publish.outputs.version }}"
          TAG="v${VERSION}"

          # Idempotent: skip if tag/release already exist.
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi
          if ! git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "v${VERSION}" \
              --generate-notes \
              --latest
          else
            echo "Release $TAG already exists -- skipping"
          fi

  # Attaches the release's buildable source tarball, built from its tag, if it lacks one.
  source-tarball:
    needs: publish
    if: needs.publish.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/source-tarball.yml
    with:
      tag: v${{ needs.publish.outputs.version }}
